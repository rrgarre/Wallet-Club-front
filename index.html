<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wallet Club — captura de puntos para comercios, camareros y clientes." />

    <!-- PWA: el <link rel="manifest"> lo inyecta vite-plugin-pwa en el build -->
    <meta name="theme-color" content="#1f6feb" />

    <!-- Iconos: acceso directo estándar del navegador (bookmark/barra) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- iPhone/iPad: instalación desde Safari (Compartir → Añadir a pantalla de inicio) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wallet Club" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Vista previa al compartir / guardar el marcador -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wallet Club" />
    <meta property="og:description" content="Captura de puntos de Wallet Club." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <title>Wallet Club</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
